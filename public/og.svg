<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="0" cy="0" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F6F4A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0e1216" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="1200" cy="630" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b89968" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0e1216" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F6F4A"/>
      <stop offset="1" stop-color="#b89968"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0e1216"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Brand -->
  <g transform="translate(80,80)">
    <rect width="44" height="44" rx="10" fill="url(#logo)"/>
    <text x="60" y="32" font-family="Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#f5f5f7" letter-spacing="-0.5">Lafala</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80,300)">
    <text font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#b89968" letter-spacing="3">AI-FIRST · ERP</text>
    <text y="80" font-family="Inter,Helvetica,Arial,sans-serif" font-size="72" font-weight="700" fill="#f5f5f7" letter-spacing="-1.5">Run your ERP by asking,</text>
    <text y="160" font-family="Inter,Helvetica,Arial,sans-serif" font-size="72" font-weight="700" fill="#f5f5f7" letter-spacing="-1.5">not clicking.</text>
    <text y="220" font-family="Inter,Helvetica,Arial,sans-serif" font-size="26" fill="#a8a8b3">An AI-first SaaS ERP for whole-house custom furniture SMBs.</text>
  </g>

  <!-- Footer -->
  <g transform="translate(80,560)" font-family="Inter,Helvetica,Arial,sans-serif" font-size="20" fill="#797986">
    <text>lafala.tech</text>
    <text x="1040" text-anchor="end">Press ⌘K · 37 AI tools</text>
  </g>
</svg>
